plugins {
    id 'com.android.application'
}

android {
    namespace = 'com.course.tongxiao'
    compileSdk = 36

    defaultConfig {
        applicationId = 'com.course.tongxiao'
        minSdk = 26
        targetSdk = 36
        versionCode = 1
        versionName = '0.1'
        testInstrumentationRunner = 'androidx.test.runner.AndroidJUnitRunner'
        // Room schema JSON is committed under schemas/ (G5: field-by-field review).
        javaCompileOptions {
            annotationProcessorOptions {
                arguments += ['room.schemaLocation': "$projectDir/schemas".toString()]
            }
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    // Release signing for the course submission. The keystore lives OUTSIDE the
    // repository (D:\Android\tongxiao-keys\) so it is not published by accident;
    // the same path can be overridden with -PtongxiaoKeystore=... in CI.
    signingConfigs {
        release {
            storeFile file(project.findProperty('tongxiaoKeystore')
                    ?: 'D:/Android/tongxiao-keys/tongxiao.jks')
            storePassword project.findProperty('tongxiaoStorePassword') ?: 'tongxiao2026'
            keyAlias project.findProperty('tongxiaoKeyAlias') ?: 'tongxiao'
            keyPassword project.findProperty('tongxiaoKeyPassword') ?: 'tongxiao2026'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
        // Debug is signed with the SAME key on purpose: a debug build installed
        // from Android Studio and a release APK copied to the phone then upgrade
        // each other. Mixing keys makes Android answer
        // INSTALL_FAILED_UPDATE_INCOMPATIBLE, which looks like "install failed"
        // with no explanation.
        debug {
            signingConfig signingConfigs.release
        }
    }
}

dependencies {
    implementation 'com.google.android.material:material:1.14.0'
    implementation 'androidx.appcompat:appcompat:1.8.0'

    // Step 1.2: Room (entities/DAOs) + LiveData support in DAOs.
    implementation 'androidx.room:room-runtime:2.8.5'
    annotationProcessor 'androidx.room:room-compiler:2.8.5'
    implementation 'androidx.lifecycle:lifecycle-livedata:2.11.0'

    // Step 3.1: list screen (ViewModel + RecyclerView; material pulls recyclerview
    // transitively but the UI step depends on it directly).
    implementation 'androidx.lifecycle:lifecycle-viewmodel:2.11.0'
    implementation 'androidx.recyclerview:recyclerview:1.4.0'

    // Step 6.4: periodic self-check (re-arms alarms missing from AlarmManager).
    implementation 'androidx.work:work-runtime:2.12.0'

    // Step 1.2 G2: in-memory DB tests on device/emulator.
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test:runner:1.7.0'
    androidTestImplementation 'androidx.test:core:1.7.0'
    // Room schema migration test (v1 �� v2: vibrateStrength).
    androidTestImplementation 'androidx.room:room-testing:2.8.5'
}
