plugins {
    id 'com.android.application'
}

android {
    namespace 'com.course.tongxiao'
    compileSdk 36

    defaultConfig {
        applicationId 'com.course.tongxiao'
        minSdk 26
        targetSdk 36
        versionCode 1
        versionName '0.1'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Step 1.1 skeleton only: theme + base activity. Room/WorkManager/ViewModel
    // enter at their own steps (1.2 / 6.4 / 3.1) per plan.md.
    implementation 'com.google.android.material:material:1.14.0'
    implementation 'androidx.appcompat:appcompat:1.8.0'
}
